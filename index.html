<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question For You ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="floating-hearts"></div>

<div class="card">

    <!-- Cute cartoon -->
    <div id="cartoon" class="cartoon">
        <div class="ears">🐰</div>
        <div class="face">🥺</div>
        <div class="speech">Waiting for your answer... 💕</div>
    </div>

    <div id="questionScreen">

        <div class="heart">❤️</div>

        <h1>Will you love me?</h1>

        <p id="message">
            I have a very important question for you... 🥺
        </p>

        <div class="buttons">

            <button id="yesBtn">
                Yes ❤️
            </button>

            <button id="noBtn">
                No 😭
            </button>

        </div>

    </div>


    <!-- YES SCREEN -->

    <div id="yesScreen" class="hidden">

        <div class="celebration">
            💖 🥰 💕
        </div>

        <h1>YAY!!! 🎉</h1>

        <p>You said YES! ❤️</p>

        <p>That made this little bunny very happy! 🐰💕</p>

        <div class="party">
            🎈 💕 🎉 ❤️ 🎊 💖
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
<script src="script.js"></script>
